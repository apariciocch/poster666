<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Póster PDF e Imágenes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #ececec, #fafafa);
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 20px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .preview {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #4a90e2;
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 5px 2px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #3568a3;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #9a9a9a; /* Fondo azul */
            color: #d1d0d0; /* Texto blanco */
            position: fixed; 
            bottom: 0; 
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generador de Póster PDF e Imágenes</h1>
        <input type="file" id="imageInput" accept="image/*">
        <br><br>
        <p>La imagen se dividirá automáticamente en 4 páginas A4 con bordes de 1&nbsp;cm.</p>
        <br>
        <button onclick="generatePDF()">Generar PDF</button>
        <button onclick="generateImages()">Generar Imágenes</button>
        <br><br>
        <img id="preview" class="preview" src="" alt="Vista previa de la imagen">
    </div>

    <footer>
        Aparicio Armando Capcha Chavez
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        document.getElementById('imageInput').addEventListener('change', previewImage);

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const imgData = document.getElementById('preview').src;

            if (!imgData) {
                alert("Por favor, suba una imagen primero.");
                return;
            }

            const marginCm = 1;
            const marginPx = marginCm * 28.35; // Conversión de cm a px (1 cm = 28.35 px)

            const pdf = new jsPDF({
                orientation: "portrait",
                unit: "px",
                format: [612, 792] // Tamaño A4 en pixeles
            });

            const img = new Image();
            img.src = imgData;

            img.onload = function() {
                const imgWidth = img.width;
                const imgHeight = img.height;

                const cols = 2;
                const rows = 2;

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                const contentWidth = pageWidth - 2 * marginPx;
                const contentHeight = pageHeight - 2 * marginPx;

                const totalWidth = contentWidth * cols;
                const totalHeight = contentHeight * rows;

                const scale = Math.min(totalWidth / imgWidth, totalHeight / imgHeight);

                const scaledWidth = imgWidth * scale;
                const scaledHeight = imgHeight * scale;
                const xOffset = (totalWidth - scaledWidth) / 2;
                const yOffset = (totalHeight - scaledHeight) / 2;

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        if (row > 0 || col > 0) {
                            pdf.addPage();
                        }

                        pdf.addImage(
                            img,
                            "JPEG",
                            -col * contentWidth + marginPx + xOffset,
                            -row * contentHeight + marginPx + yOffset,
                            scaledWidth,
                            scaledHeight,
                            undefined,
                            "FAST"
                        );
                    }
                }

                pdf.save("poster.pdf");
            };
        }

        async function generateImages() {
            const imgData = document.getElementById('preview').src;

            if (!imgData) {
                alert("Por favor, suba una imagen primero.");
                return;
            }

            const marginCm = 1;
            const marginPx = marginCm * 28.35; // Conversión de cm a px (1 cm = 28.35 px)

            const img = new Image();
            img.src = imgData;

            img.onload = function() {
                const imgWidth = img.width;
                const imgHeight = img.height;

                const cols = 2;
                const rows = 2;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const pageWidth = 612; // Tamaño A4 en pixeles
                const pageHeight = 792; // Tamaño A4 en pixeles

                const contentWidth = pageWidth - 2 * marginPx;
                const contentHeight = pageHeight - 2 * marginPx;

                const totalWidth = contentWidth * cols;
                const totalHeight = contentHeight * rows;

                const scale = Math.min(totalWidth / imgWidth, totalHeight / imgHeight);

                const scaledWidth = imgWidth * scale;
                const scaledHeight = imgHeight * scale;
                const xOffset = (totalWidth - scaledWidth) / 2;
                const yOffset = (totalHeight - scaledHeight) / 2;

                canvas.width = contentWidth;
                canvas.height = contentHeight;

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(
                            img,
                            -col * contentWidth + marginPx + xOffset,
                            -row * contentHeight + marginPx + yOffset,
                            scaledWidth,
                            scaledHeight
                        );

                        const link = document.createElement('a');
                        link.href = canvas.toDataURL();
                        link.download = `poster_part_${row + 1}_${col + 1}.png`;
                        link.click();
                    }
                }
            };
        }
    </script>
</body>
</html>
